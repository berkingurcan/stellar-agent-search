<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Sibling mark to stellar8004's saturn: same ringed-planet construction and hue-250
       palette, but the body carries a check — this project's whole subject is the
       declared-vs-verified diff, not the registry itself. -->
  <rect width="128" height="128" rx="24" fill="oklch(0.13 0.014 250)"/>
  <g transform="translate(64,64)">
    <defs>
      <radialGradient id="planet" cx="40%" cy="35%" r="50%">
        <stop offset="0%" stop-color="oklch(0.82 0.08 250)"/>
        <stop offset="100%" stop-color="oklch(0.55 0.12 250)"/>
      </radialGradient>
    </defs>
    <circle r="22" fill="url(#planet)"/>
    <!-- Ring behind -->
    <ellipse rx="42" ry="12" fill="none" stroke="oklch(0.74 0.07 250)" stroke-width="2.5" opacity="0.3" transform="rotate(-20)"/>
    <!-- Ring front -->
    <clipPath id="front">
      <rect x="-50" y="0" width="100" height="50" transform="rotate(-20)"/>
    </clipPath>
    <ellipse rx="42" ry="12" fill="none" stroke="oklch(0.74 0.07 250)" stroke-width="2.5" opacity="0.7" transform="rotate(-20)" clip-path="url(#front)"/>
    <!-- Verified check, in the positive hue used for `verified` throughout the UI -->
    <path d="M-9 0 L-3 6.5 L9.5 -7" fill="none" stroke="oklch(0.20 0.03 250)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-9 0 L-3 6.5 L9.5 -7" fill="none" stroke="oklch(0.80 0.13 162)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
