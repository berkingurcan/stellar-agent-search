name: Publish

# A tag release is accepted only from main and publishes one already-gated
# tarball to npm (Trusted Publishing) before registering its immutable metadata.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org
  MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
  EXPECTED_REPOSITORY_URL: https://github.com/berkingurcan/stellar-agent-mcp
  EXPECTED_NPM_OWNERS: ${{ vars.NPM_PACKAGE_OWNERS }}

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This environment must be created in GitHub with a required reviewer,
    # self-review disabled, admin bypass disabled, and selected tag pattern v*.
    # The same name must be set on npm's Trusted Publisher configuration.
    environment: npm-production

    steps:
      - name: Checkout complete release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # >=22.14 is required for npm Trusted Publishing.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm
        run: npm install -g npm@11.17.0

      - name: Validate release tag, versions, and main ancestry
        id: release
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if [[ -z "$release_commit" || "$(git rev-parse HEAD)" != "$release_commit" ]]; then
            echo "::error::Checkout does not resolve to the tagged release commit."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$release_commit" ]]; then
            echo "::error::GitHub event SHA does not resolve to the tagged release commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Tagged commit $release_commit is not on origin/main."
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          server_version="$(node -p "require('./server.json').version")"
          package_manifest_version="$(node -p "require('./server.json').packages[0].version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi
          if [[ "$server_version" != "$package_version" || "$package_manifest_version" != "$package_version" ]]; then
            echo "::error::package.json and both server.json version fields must match."
            exit 1
          fi
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Validate local release metadata
        run: npm run validate:release

      - name: Validate server.json against its checksum-pinned schema
        env:
          SERVER_SCHEMA_SHA256: 3fba09590c99f61735d234822279f4223fab9e300c0a81e81c91ab62a4114de0
        shell: bash
        run: |
          schema="$RUNNER_TEMP/server.schema.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$schema" https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          echo "$SERVER_SCHEMA_SHA256  $schema" | sha256sum -c -
          npm run validate:release -- --schema "$schema"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack and inspect the exact release tarball
        id: pack
        shell: bash
        run: |
          destination="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$destination"
          npm pack --json --pack-destination "$destination" > "$RUNNER_TEMP/npm-pack.json"
          filename="$(node -e "const p=require(process.argv[1]); if(p.length!==1) process.exit(1); process.stdout.write(p[0].filename)" "$RUNNER_TEMP/npm-pack.json")"
          tarball="$destination/$filename"
          test -f "$tarball"
          tar -tzf "$tarball" > "$RUNNER_TEMP/npm-pack-files.txt"
          for required in package/package.json package/LICENSE package/README.md package/dist/index.js; do
            grep -Fxq "$required" "$RUNNER_TEMP/npm-pack-files.txt" || {
              echo "::error::Packed tarball is missing $required."
              exit 1
            }
          done
          if grep -Eq '^package/(src|test|scripts|worker|web|\.env)(/|$)' "$RUNNER_TEMP/npm-pack-files.txt"; then
            echo "::error::Packed tarball contains source, tests, release scripts, deployment code, or env files."
            exit 1
          fi
          echo "path=$tarball" >> "$GITHUB_OUTPUT"

      # Generate from a fresh consumer install of the packed artifact. Root
      # overrides do not apply here, so this is the graph users actually get.
      - name: Generate packed-consumer runtime SBOM (CycloneDX)
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/sbom-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund --save-exact "${{ steps.pack.outputs.path }}"
          expected_version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          actual_version="$(./node_modules/.bin/stellar-agent-mcp --version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Packed CLI reported $actual_version, expected $expected_version."
            exit 1
          fi
          npm ls --all
          npm sbom --omit=dev --sbom-format cyclonedx > "$GITHUB_WORKSPACE/stellar-agent-mcp.cdx.json"

      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stellar-agent-mcp-${{ github.ref_name }}-sbom
          path: stellar-agent-mcp.cdx.json
          if-no-files-found: error

      - name: Audit packed-consumer runtime graph
        shell: bash
        run: |
          cd "$RUNNER_TEMP/sbom-consumer"
          npm audit --omit=dev --audit-level=high

      # The name must first be reserved as 0.0.0 under the non-default
      # "bootstrap" dist-tag. If it is absent, OIDC cannot have been configured
      # yet; fail instead of attempting to publish an unowned package.
      - name: Verify npm ownership and check the immutable version
        id: npm-version
        shell: bash
        run: |
          if [[ -z "$EXPECTED_NPM_OWNERS" ]]; then
            echo "::error::Set the NPM_PACKAGE_OWNERS Actions variable to the exact npm maintainer allowlist."
            exit 1
          fi
          package_name="$(node -p "require('./package.json').name")"
          encoded_name="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$package_name")"
          status="$(curl --fail-with-body --silent --show-error --output "$RUNNER_TEMP/npm-packument.json" --write-out '%{http_code}' "$NPM_REGISTRY_URL/$encoded_name" || true)"
          case "$status" in
            200)
              node scripts/release/verify-npm-release.mjs preflight --packument "$RUNNER_TEMP/npm-packument.json" --tarball "${{ steps.pack.outputs.path }}" --owners "$EXPECTED_NPM_OWNERS" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "::error::npm package is unclaimed. Publish only 0.0.0 with --tag bootstrap, configure Trusted Publishing, then rerun."
              exit 1
              ;;
            *)
              echo "::error::npm package preflight returned HTTP ${status:-transport-error}."
              exit 1
              ;;
          esac

      - name: Publish exact tarball to npm (provenance via OIDC)
        if: steps.npm-version.outputs.exists != 'true'
        # The exact archive above was already validated. Suppressing lifecycle
        # scripts here prevents npm from rebuilding a different artifact.
        run: npm publish "${{ steps.pack.outputs.path }}" --ignore-scripts --access public

      - name: Verify npm artifact, owner path, and provenance
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          encoded_name="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$package_name")"
          attestation_name="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]).replace('%40','@'))" "$package_name")"

          metadata_status=0
          attestation_status=0
          for attempt in {1..12}; do
            metadata_status="$(curl --silent --show-error --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "$NPM_REGISTRY_URL/$encoded_name/$package_version" || true)"
            attestation_status="$(curl --silent --show-error --output "$RUNNER_TEMP/npm-attestations.json" --write-out '%{http_code}' "$NPM_REGISTRY_URL/-/npm/v1/attestations/$attestation_name@$package_version" || true)"
            if [[ "$metadata_status" == 200 && "$attestation_status" == 200 ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$metadata_status" != 200 || "$attestation_status" != 200 ]]; then
            echo "::error::npm metadata/provenance did not become readable (metadata=$metadata_status, attestations=$attestation_status)."
            exit 1
          fi

          node scripts/release/verify-npm-release.mjs published --metadata "$RUNNER_TEMP/npm-version.json" --attestations "$RUNNER_TEMP/npm-attestations.json" --tarball "${{ steps.pack.outputs.path }}" --repository "$EXPECTED_REPOSITORY_URL" --workflow ".github/workflows/publish.yml" --ref "$GITHUB_REF" --commit "${{ steps.release.outputs.commit }}"

          consumer="$RUNNER_TEMP/registry-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --save-exact "$package_name@$package_version"
          npm audit signatures

      - name: Install checksum-pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        shell: bash
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"

      - name: Check immutable MCP Registry version
        id: mcp-version
        shell: bash
        run: |
          server_name="$(node -p "require('./server.json').name")"
          server_version="$(node -p "require('./server.json').version")"
          encoded_name="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$server_name")"
          encoded_version="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$server_version")"
          url="$MCP_REGISTRY_URL/v0.1/servers/$encoded_name/versions/$encoded_version"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-registry-version.json" --write-out '%{http_code}' "$url" || true)"
          case "$status" in
            200)
              node scripts/release/verify-mcp-registry.mjs "$RUNNER_TEMP/mcp-registry-version.json"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::MCP Registry version preflight returned HTTP ${status:-transport-error}."
              exit 1
              ;;
          esac

      - name: Login to MCP Registry (GitHub OIDC)
        id: mcp-login
        if: steps.mcp-version.outputs.exists != 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Publish to MCP Registry
        if: steps.mcp-version.outputs.exists != 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish server.json

      - name: Verify MCP Registry publication
        shell: bash
        run: |
          server_name="$(node -p "require('./server.json').name")"
          server_version="$(node -p "require('./server.json').version")"
          encoded_name="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$server_name")"
          encoded_version="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$server_version")"
          url="$MCP_REGISTRY_URL/v0.1/servers/$encoded_name/versions/$encoded_version"
          status=0
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/mcp-registry-version.json" --write-out '%{http_code}' "$url" || true)"
            [[ "$status" == 200 ]] && break
            sleep 5
          done
          if [[ "$status" != 200 ]]; then
            echo "::error::MCP Registry version did not become readable (HTTP $status)."
            exit 1
          fi
          node scripts/release/verify-mcp-registry.mjs "$RUNNER_TEMP/mcp-registry-version.json"

      - name: Remove publisher credentials and temporary release tools
        if: always()
        shell: bash
        run: |
          if [[ -x "$RUNNER_TEMP/mcp-publisher" ]]; then
            "$RUNNER_TEMP/mcp-publisher" logout >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/mcp-publisher" "$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
