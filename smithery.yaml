# Smithery configuration — https://smithery.ai/docs
# This is a LOCAL (npx) stdio MCP server: it runs on the user's own machine.
# Smithery indexes it for discovery but does not host/run it.
runtime: "typescript"
target: "local"
startCommand:
  type: "stdio"
  configSchema:
    type: object
    properties:
      STELLAR_NETWORK:
        type: string
        enum: ["mainnet", "testnet"]
        default: "mainnet"
        description: "Stellar network to target. 'testnet' also requires EXPLORER_BASE_URL or REGISTRY_AGENT_IDS."
      EXPLORER_BASE_URL:
        type: string
        description: "Override the stellar-8004 explorer API base URL. On 'testnet', set this or REGISTRY_AGENT_IDS — the default explorer indexes mainnet only, and the server refuses to start with neither."
      REGISTRY_AGENT_IDS:
        type: string
        description: "Registry mode: comma-separated agent ids read straight from the Identity contract, with no explorer. Not combinable with EXPLORER_BASE_URL."
      TRUSTED_VALIDATORS:
        type: string
        description: "Comma-separated G… or C… addresses of the verifiers whose Validation Registry records earn Provider Standard badges in get_provider_manifest. Empty: the registry is not read."
      STELLAR_RPC_URL:
        type: string
        description: "Override the Soroban RPC URL used for the bounded Reputation-contract probe."
      VERIFY_ONCHAIN:
        type: string
        enum: ["true", "false"]
        default: "true"
        description: "Set to 'false' to skip the bounded contract probe; reputation remains Explorer-declared."
    required: []
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "stellar-agent-search@0.1.0", "mcp"],
      env: {
        STELLAR_NETWORK: config.STELLAR_NETWORK || "mainnet",
        ...(config.EXPLORER_BASE_URL ? { EXPLORER_BASE_URL: config.EXPLORER_BASE_URL } : {}),
        ...(config.REGISTRY_AGENT_IDS ? { REGISTRY_AGENT_IDS: config.REGISTRY_AGENT_IDS } : {}),
        ...(config.TRUSTED_VALIDATORS ? { TRUSTED_VALIDATORS: config.TRUSTED_VALIDATORS } : {}),
        ...(config.STELLAR_RPC_URL ? { STELLAR_RPC_URL: config.STELLAR_RPC_URL } : {}),
        ...(config.VERIFY_ONCHAIN ? { VERIFY_ONCHAIN: config.VERIFY_ONCHAIN } : {})
      }
    })
  exampleConfig:
    STELLAR_NETWORK: "mainnet"
    VERIFY_ONCHAIN: "true"
